<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Chăn bông rằn ri gấp vuông vức trên giường">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0ea"/><stop offset="1" stop-color="#dfe3da"/>
    </linearGradient>
    <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f6e45"/><stop offset="1" stop-color="#3a5534"/>
    </linearGradient>
    <!-- woodland camouflage of the issued quilt: green base, big yellow-green
         patches, brown and black shapes -->
    <pattern id="camo" width="130" height="110" patternUnits="userSpaceOnUse">
      <rect width="130" height="110" fill="#3f6a35"/>
      <path d="M-6 12C14 0 46 4 60 14 70 22 52 32 34 30 16 28-12 26-6 12Z" fill="#b8c55c"/>
      <path d="M70 58C92 48 124 52 134 64 138 74 116 80 98 76 80 72 62 68 70 58Z" fill="#b8c55c"/>
      <path d="M14 82C30 76 52 80 56 90 58 100 38 102 26 98 12 94 4 88 14 82Z" fill="#b8c55c"/>
      <path d="M66 8C84 0 110 6 112 18 112 30 90 30 78 26 64 22 56 14 66 8Z" fill="#5d4a3d"/>
      <path d="M2 48C16 40 38 46 40 56 40 66 22 68 12 64 2 60-6 54 2 48Z" fill="#5d4a3d"/>
      <path d="M86 92C98 86 116 90 116 100 114 108 98 110 90 104Z" fill="#5d4a3d"/>
      <path d="M44 38C58 32 76 38 74 48 70 58 54 56 46 52 38 48 36 42 44 38Z" fill="#1d1f1a"/>
      <path d="M108 30C118 26 130 32 128 40 124 48 112 46 108 40Z" fill="#1d1f1a"/>
      <path d="M50 96C60 92 74 96 72 104 68 110 56 110 50 104Z" fill="#1d1f1a"/>
    </pattern>
    <!-- each folded layer is a rounded roll: lit on top, shaded underneath -->
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".8" stop-color="#000" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="khaki" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d9a62"/><stop offset=".45" stop-color="#8f8c56"/><stop offset="1" stop-color="#6c6a3e"/>
    </linearGradient>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="9" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <!-- the quilt seen from its folded end: top surface going back, then the
         stacked rounded layers facing us -->
    <path id="top" d="M72 108Q74 92 94 90H304Q324 92 326 110Z"/>
    <path id="layer1" d="M70 112Q70 102 82 102H300Q322 102 324 122Q326 142 304 146H84Q68 146 68 130Q68 118 70 112Z"/>
    <path id="layer2" d="M80 146H296Q312 146 312 162Q312 178 296 180H80Q68 178 68 162Q68 148 80 146Z"/>
    <path id="layer3" d="M76 178H306Q324 180 324 198Q324 214 306 216H76Q62 214 62 198Q62 180 76 178Z"/>
    <path id="layer4" d="M74 214H310Q330 216 330 234Q330 252 310 254H74Q58 252 58 234Q58 216 74 214Z"/>
    <clipPath id="clip"><use href="#top"/><use href="#layer1"/><use href="#layer2"/><use href="#layer3"/><use href="#layer4"/></clipPath>
  </defs>
  <rect width="400" height="300" fill="url(#wall)"/>

  <!-- bed -->
  <path d="M0 232H400V300H0Z" fill="url(#bed)"/>
  <path d="M0 232H400" stroke="#2c4327" stroke-width="2"/>
  <ellipse cx="200" cy="258" rx="150" ry="12" fill="#0f1a0d" opacity=".5" filter="url(#blur8)"/>

  <!-- top of the folded stack -->
  <use href="#top" fill="url(#camo)"/>
  <use href="#top" fill="#fff" opacity=".1"/>

  <!-- stacked layers, bottom first so each upper roll overlaps the one below -->
  <use href="#layer4" fill="url(#camo)"/><use href="#layer4" fill="url(#roll)"/>
  <use href="#layer3" fill="url(#camo)"/><use href="#layer3" fill="url(#roll)"/>
  <!-- the olive-tan inner layer, tucked in a little -->
  <use href="#layer2" fill="url(#khaki)"/><use href="#layer2" fill="url(#roll)" opacity=".7"/>
  <use href="#layer1" fill="url(#camo)"/><use href="#layer1" fill="url(#roll)"/>

  <!-- shadows in the creases between layers -->
  <g fill="none" stroke="#000" stroke-opacity=".4" stroke-width="4" filter="url(#soft)">
    <path d="M84 147H300M80 180H306M78 216H310"/>
  </g>
  <rect x="50" y="60" width="310" height="200" clip-path="url(#clip)" filter="url(#noise)" opacity=".08" style="mix-blend-mode:multiply"/>

  <!-- edges -->
  <g fill="none" stroke="#1f2a1b" stroke-width="1.3" stroke-linejoin="round" stroke-opacity=".8">
    <use href="#top"/><use href="#layer4"/><use href="#layer3"/><use href="#layer2"/><use href="#layer1"/>
  </g>
</svg>
