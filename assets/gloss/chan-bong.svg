<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Chăn bông rằn ri gấp vuông vức trên giường">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f4ef"/><stop offset="1" stop-color="#e3e7de"/>
    </linearGradient>
    <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c6d48"/><stop offset="1" stop-color="#34502f"/>
    </linearGradient>
    <!-- camouflage like the issued quilt cover -->
    <pattern id="camo" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#43632f"/>
      <path d="M4 14C20 2 44 6 52 18 58 28 40 36 28 32 16 28-4 26 4 14Z" fill="#b5bd58"/>
      <path d="M70 70C88 60 112 66 112 80 112 94 90 96 78 90 68 84 60 76 70 70Z" fill="#b5bd58"/>
      <path d="M60 10C76 2 98 8 96 20 94 32 74 30 64 26 54 22 52 16 60 10Z" fill="#5a4234"/>
      <path d="M8 74C22 66 40 72 40 84 40 96 22 98 14 92 6 86 0 80 8 74Z" fill="#5a4234"/>
      <path d="M44 44C58 36 76 44 72 54 68 64 52 62 46 58 40 54 36 50 44 44Z" fill="#1b1e18"/>
      <path d="M96 36C106 32 120 38 118 48 114 56 102 54 96 48Z" fill="#1b1e18"/>
      <path d="M30 104C42 98 58 102 56 112 52 120 38 120 30 114Z" fill="#1b1e18"/>
      <path d="M86 100C96 96 108 100 106 108 102 116 90 114 86 108Z" fill="#b5bd58"/>
    </pattern>
    <linearGradient id="khaki" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a9760"/><stop offset=".5" stop-color="#8a8752"/><stop offset="1" stop-color="#6f6c40"/>
    </linearGradient>
    <linearGradient id="frontShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#000" stop-opacity=".18"/>
    </linearGradient>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="9" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <!-- blanket faces, with slightly rounded, puffy edges -->
    <path id="top" d="M88 120Q90 114 98 110L130 92Q136 89 144 89H322Q332 90 330 98L294 118Q290 121 282 121H96Q88 122 88 120Z"/>
    <path id="side" d="M294 118L330 96Q334 100 333 108V212Q333 220 326 226L296 250Q292 240 292 230V128Q292 121 294 118Z"/>
    <path id="front" d="M96 120H284Q294 120 294 130V242Q294 254 282 254H98Q86 254 86 242V130Q86 120 96 120Z"/>
    <clipPath id="clipFront"><use href="#front"/></clipPath>
  </defs>
  <rect width="400" height="300" fill="url(#wall)"/>

  <!-- bed: sheet with soft wrinkles -->
  <path d="M0 226H400V300H0Z" fill="url(#bed)"/>
  <path d="M0 226H400" stroke="#2b4227" stroke-width="2"/>
  <g fill="none" stroke="#000" stroke-opacity=".18" stroke-width="3" filter="url(#soft)">
    <path d="M20 270q40-8 70 4M300 280q40-10 80-2M330 248q24 4 50-4"/>
  </g>
  <!-- contact shadow -->
  <ellipse cx="208" cy="256" rx="134" ry="12" fill="#0f1a0d" opacity=".45" filter="url(#blur6)"/>

  <!-- folded quilt -->
  <use href="#side" fill="url(#camo)"/>
  <use href="#side" fill="#000" opacity=".28"/>
  <use href="#top" fill="url(#camo)"/>
  <use href="#top" fill="#fff" opacity=".12"/>
  <use href="#front" fill="url(#camo)"/>

  <!-- the front shows the folded layers: cover, the khaki inner layer, cover -->
  <g clip-path="url(#clipFront)">
    <rect x="80" y="118" width="220" height="140" fill="url(#frontShade)"/>
    <path d="M86 160Q86 154 94 154H286Q294 154 294 160V196Q294 202 286 202H94Q86 202 86 196Z" fill="url(#khaki)"/>
    <g fill="none" stroke="#000" stroke-opacity=".35" stroke-width="3" filter="url(#soft)">
      <path d="M86 155H294M86 202H294M86 228H294"/>
    </g>
    <g fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2" filter="url(#soft)">
      <path d="M92 162H288M92 208H288M92 233H288"/>
    </g>
    <rect x="80" y="118" width="220" height="140" filter="url(#noise)" opacity=".1" style="mix-blend-mode:multiply"/>
  </g>

  <!-- crisp edges: the quilt is folded "vuông thành sắc cạnh" -->
  <g fill="none" stroke="#1e2a1a" stroke-width="1.6" stroke-linejoin="round">
    <use href="#top"/><use href="#side"/><use href="#front"/>
  </g>
  <path d="M294 122Q300 124 300 132" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
</svg>
