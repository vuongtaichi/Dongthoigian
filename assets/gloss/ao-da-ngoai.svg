<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Áo dã ngoại lục quân, vải rằn ri xanh đậm">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f4ef"/><stop offset="1" stop-color="#e1e6db"/>
    </linearGradient>
    <!-- Lục quân K20 camouflage: dark green base, mid-green and bright
         leaf-green patches, dark navy-black squiggles and blots -->
    <pattern id="camo" width="150" height="96" patternUnits="userSpaceOnUse">
      <rect width="150" height="96" fill="#30492c"/>
      <path d="M-4 8C20 0 52 4 70 10 84 15 70 24 50 22 28 20 6 22-4 18Z" fill="#4d7c42"/>
      <path d="M78 46C100 38 136 40 154 48 160 54 140 60 118 58 96 56 76 56 78 46Z" fill="#4d7c42"/>
      <path d="M10 60C30 54 56 58 66 66 70 74 46 76 30 72 14 68 2 66 10 60Z" fill="#4d7c42"/>
      <path d="M96 6C112 2 136 6 146 12 150 18 130 20 116 18 102 16 90 12 96 6Z" fill="#7fb06a"/>
      <path d="M30 34C46 30 70 32 80 36 84 40 66 42 52 41 38 40 24 38 30 34Z" fill="#7fb06a"/>
      <path d="M100 78C114 74 136 76 144 80 146 84 130 86 118 85 106 84 94 82 100 78Z" fill="#7fb06a"/>
      <path d="M4 86C14 82 30 84 34 88 34 92 20 92 12 91Z" fill="#7fb06a"/>
      <g fill="none" stroke="#1a2230" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 28c8-4 14 2 22-2s10-8 18-4"/>
        <path d="M70 26c6 6 14 2 20 6s12 4 18-2"/>
        <path d="M44 52c8-6 16 0 22-6"/>
        <path d="M112 66c6-4 12 2 20-2s8-6 14-2"/>
        <path d="M60 86c6 4 14 0 20 4"/>
        <path d="M128 30c4 4 10 2 14 6"/>
      </g>
      <path d="M118 18C126 14 136 18 134 24 130 30 120 28 118 24Z" fill="#1a2230"/>
      <path d="M20 44C28 40 38 44 36 50 32 56 22 54 20 50Z" fill="#1a2230"/>
    </pattern>
    <linearGradient id="light" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".1"/>
      <stop offset=".4" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".75" stop-color="#000" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="web" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3f33"/><stop offset="1" stop-color="#18221b"/>
    </linearGradient>
    <linearGradient id="buckle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e4a40"/><stop offset="1" stop-color="#1c241e"/>
    </linearGradient>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.8"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1b2418" flood-opacity=".28"/>
    </filter>
    <!-- straight-cut field jacket, worn out over the trousers (mid-thigh) -->
    <path id="torso" d="M172 34L134 48Q128 80 134 108L134 284Q200 290 266 284L266 108Q272 80 266 48L228 34Q214 50 200 70Q186 50 172 34Z"/>
    <!-- sleeves: slim, sloping shoulders (not puffed like the padded áo bông) -->
    <path id="sleeveL" d="M134 48Q122 56 114 72Q106 160 100 250Q112 257 125 255Q128 190 138 120Z"/>
    <path id="sleeveR" d="M266 48Q278 56 286 72Q294 160 300 250Q288 257 275 255Q272 190 262 120Z"/>
    <clipPath id="clip"><use href="#torso"/><use href="#sleeveL"/><use href="#sleeveR"/></clipPath>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- whole jacket drawn a little shorter and slimmer, around its centre -->
  <g transform="translate(200 162) scale(.88 .8) translate(-200 -162)">

  <g filter="url(#shadow)">
    <use href="#sleeveL" fill="url(#camo)"/>
    <use href="#sleeveR" fill="url(#camo)"/>
    <use href="#torso" fill="url(#camo)"/>
  </g>

  <!-- light, folds and fabric texture, clipped to the jacket -->
  <g clip-path="url(#clip)">
    <rect x="80" y="20" width="240" height="280" fill="url(#light)"/>
    <g fill="none" stroke="#000" stroke-opacity=".32" stroke-width="3" filter="url(#soft)">
      <path d="M136 112q4 70 0 170M264 112q-4 70 0 170"/>
      <path d="M108 150q7-5 16 0M106 176q8-4 18 2M292 150q-7-5-16 0M294 176q-8-4-18 2"/>
      <path d="M140 196q30 10 60 2q32 10 64-2"/>
      <path d="M150 274q20-8 40-2M212 274q20-8 40-2"/>
    </g>
    <rect x="80" y="20" width="240" height="280" filter="url(#noise)" opacity=".12" style="mix-blend-mode:multiply"/>
  </g>

  <!-- outlines -->
  <g fill="none" stroke="#121a12" stroke-width="1.5" stroke-linejoin="round">
    <use href="#sleeveL"/><use href="#sleeveR"/><use href="#torso"/>
  </g>

  <!-- cuffs -->
  <path d="M101 240Q112 247 125 245M299 240Q288 247 275 245" fill="none" stroke="#121a12" stroke-width="1.3"/>

  <!-- sleeve patch (wearer's upper left arm): dark shield, yellow border -->
  <g transform="translate(-8 2)">
  <path d="M281 88l18 2-1 16q-3 9-10 12-8-5-9-14z" fill="#1d2a1d" stroke="#e2c44a" stroke-width="1.6"/>
  <path d="M289.5 95l1.6 3.4 3.7.4-2.8 2.5.8 3.7-3.3-1.9-3.2 1.8.8-3.6-2.7-2.6 3.7-.3z" fill="#e2c44a"/>
  </g>

  <!-- shoulder straps -->
  <g stroke="#121a12" stroke-width="1.3">
    <path d="M142 52l28-8 2 8-28 9z" fill="url(#camo)"/>
    <path d="M258 52l-28-8-2 8 28 9z" fill="url(#camo)"/>
    <circle cx="166" cy="49" r="2.2" fill="#1d261d"/><circle cx="234" cy="49" r="2.2" fill="#1d261d"/>
  </g>

  <!-- pointed shirt collar with red collar tabs -->
  <path d="M175 40Q200 32 225 40Q214 54 200 70Q186 54 175 40Z" fill="#1a2518"/>
  <g stroke="#121a12" stroke-width="1.5" stroke-linejoin="round">
    <path d="M172 34Q186 52 200 70L184 82L160 44Z" fill="url(#camo)"/>
    <path d="M228 34Q214 52 200 70L216 82L240 44Z" fill="url(#camo)"/>
  </g>
  <path d="M184 82L160 44M216 82L240 44" stroke="#000" stroke-opacity=".35" stroke-width="3" filter="url(#soft)"/>
  <path d="M165 50l11-4 9 15-11 4z" fill="#c4262c" stroke="#6e1418"/>
  <path d="M235 50l-11-4-9 15 11 4z" fill="#c4262c" stroke="#6e1418"/>
  <path d="M172 55l3-1 1.2 3 3 .3-2.2 2 .8 3-2.8-1.6-2.6 1.8.6-3-2.4-1.8 3-.4z" fill="#f2c94c"/>
  <path d="M228 55l-3-1-1.2 3-3 .3 2.2 2-.8 3 2.8-1.6 2.6 1.8-.6-3 2.4-1.8-3-.4z" fill="#f2c94c"/>

  <!-- front opening -->
  <path d="M200 70V286" stroke="#121a12" stroke-width="1.5"/>

  <!-- name tape (wearer's right) and badge (wearer's left) above the chest pockets -->
  <rect x="146" y="92" width="40" height="7" rx="1" fill="#d9ddd2" stroke="#6b7266" stroke-width=".8"/>
  <path d="M151 95.5h30" stroke="#5a6157" stroke-width="1.2" stroke-dasharray="2 1.5"/>
  <!-- small gold winged badge -->
  <path d="M234 95q-8-5-18-4 8 2 11 6 4 1 7-2zM234 95q8-5 18-4-8 2-11 6-4 1-7-2z" fill="#d1ad45" stroke="#6e5a1c" stroke-width=".7"/>
  <circle cx="234" cy="95" r="3" fill="#c4262c" stroke="#6e1418" stroke-width=".7"/>

  <!-- chest pockets with flaps -->
  <g stroke="#121a12" stroke-width="1.3" stroke-linejoin="round">
    <rect x="146" y="108" width="40" height="40" rx="3" fill="url(#camo)"/>
    <rect x="214" y="108" width="40" height="40" rx="3" fill="url(#camo)"/>
  </g>
  <g fill="#000" opacity=".3" filter="url(#soft)">
    <rect x="145" y="111" width="42" height="5"/><rect x="213" y="111" width="42" height="5"/>
  </g>
  <g stroke="#121a12" stroke-width="1.3" stroke-linejoin="round">
    <path d="M143 102h46v11H143z" fill="url(#camo)"/>
    <path d="M211 102h46v11H211z" fill="url(#camo)"/>
  </g>

  <!-- hip pockets with flaps -->
  <g stroke="#121a12" stroke-width="1.3" stroke-linejoin="round">
    <rect x="144" y="214" width="46" height="56" rx="3" fill="url(#camo)"/>
    <rect x="210" y="214" width="46" height="56" rx="3" fill="url(#camo)"/>
  </g>
  <g fill="#000" opacity=".3" filter="url(#soft)">
    <rect x="143" y="217" width="48" height="5"/><rect x="209" y="217" width="48" height="5"/>
  </g>
  <g stroke="#121a12" stroke-width="1.3" stroke-linejoin="round">
    <path d="M141 207h52v12H141z" fill="url(#camo)"/>
    <path d="M207 207h52v12H207z" fill="url(#camo)"/>
  </g>
  <g fill="none" stroke="#a9b5ad" stroke-opacity=".45" stroke-dasharray="3 3">
    <rect x="149" y="111" width="34" height="34" rx="2"/><rect x="217" y="111" width="34" height="34" rx="2"/>
    <rect x="147" y="221" width="40" height="46" rx="2"/><rect x="213" y="221" width="40" height="46" rx="2"/>
  </g>
</g>
</svg>
