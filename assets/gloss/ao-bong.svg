<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Áo bông quân đội màu xanh, lót vải rằn ri, có đai vải">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f4ef"/><stop offset="1" stop-color="#e1e6db"/>
    </linearGradient>
    <!-- padded green cotton -->
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#2c8a3c"/><stop offset=".45" stop-color="#2f9142"/><stop offset="1" stop-color="#226c30"/>
    </linearGradient>
    <!-- camouflage lining -->
    <pattern id="camo" width="44" height="44" patternUnits="userSpaceOnUse">
      <rect width="44" height="44" fill="#557a3c"/>
      <path d="M2 6C8 0 18 2 18 9 17 15 8 16 4 13 0 11-1 9 2 6Z" fill="#26331f"/>
      <path d="M22 22C28 18 38 21 37 28 35 34 26 33 23 30 20 27 19 24 22 22Z" fill="#a37a52"/>
      <path d="M26 2C32 0 40 4 38 9 35 13 28 11 26 7Z" fill="#9fb06a"/>
      <path d="M4 30C10 27 16 31 14 36 11 40 5 38 3 35Z" fill="#9fb06a"/>
    </pattern>
    <linearGradient id="light" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".4" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".75" stop-color="#000" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000" stop-opacity=".3"/>
    </linearGradient>
    <radialGradient id="btn" cx=".35" cy=".35" r=".7">
      <stop offset="0" stop-color="#8a7258"/><stop offset="1" stop-color="#3b2d1f"/>
    </radialGradient>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1b2418" flood-opacity=".28"/>
    </filter>
    <!-- a little fuller than a shirt: it's padded -->
    <path id="torso" d="M168 40L122 58Q116 92 126 124Q122 200 124 280Q200 290 276 280Q278 200 274 124Q284 92 278 58L232 40Q216 56 200 74Q184 56 168 40Z"/>
    <path id="sleeveL" d="M122 58Q98 64 90 84Q80 170 74 256Q94 266 116 262Q122 200 132 132Z"/>
    <path id="sleeveR" d="M278 58Q302 64 310 84Q320 170 326 256Q306 266 284 262Q278 200 268 132Z"/>
    <clipPath id="clip"><use href="#torso"/><use href="#sleeveL"/><use href="#sleeveR"/></clipPath>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>

  <!-- hanger -->
  <path d="M200 10v12q-7 0-7 7" fill="none" stroke="#8a8f86" stroke-width="3" stroke-linecap="round"/>
  <path d="M128 52Q200 26 272 52" fill="none" stroke="#8a8f86" stroke-width="4" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <use href="#sleeveL" fill="url(#g)"/>
    <use href="#sleeveR" fill="url(#g)"/>
    <use href="#torso" fill="url(#g)"/>
  </g>

  <!-- light, padding folds, gathers at the belt, texture -->
  <g clip-path="url(#clip)">
    <rect x="70" y="30" width="260" height="260" fill="url(#light)"/>
    <g fill="none" stroke="#000" stroke-opacity=".28" stroke-width="3.5" filter="url(#soft)">
      <path d="M128 126q4 70-2 150M272 126q-4 70 2 150"/>
      <path d="M86 140q10-6 22 0M84 176q11-5 24 2M80 214q12-5 26 2"/>
      <path d="M314 140q-10-6-22 0M316 176q-11-5-24 2M320 214q-12-5-26 2"/>
      <path d="M150 210q14 14 12 40M176 212q4 18 0 46M224 212q-4 18 0 46M250 210q-14 14-12 40"/>
      <path d="M150 184q12-10 10-26M250 184q-12-10-10-26"/>
    </g>
    <g fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="2.5" filter="url(#soft)">
      <path d="M96 110q-6 60-12 130"/>
      <path d="M162 214q6 16 4 40M238 214q-6 16-4 40"/>
    </g>
    <rect x="70" y="30" width="260" height="260" filter="url(#noise)" opacity=".1" style="mix-blend-mode:multiply"/>
  </g>

  <!-- outlines -->
  <g fill="none" stroke="#14451d" stroke-width="1.6" stroke-linejoin="round">
    <use href="#sleeveL"/><use href="#sleeveR"/><use href="#torso"/>
  </g>
  <!-- cuffs -->
  <path d="M75 244Q95 254 117 250M325 244Q305 254 283 250" fill="none" stroke="#14451d" stroke-width="1.4"/>

  <!-- neck: camouflage lining inside the back, then the turned-down collar
       whose inner edges also show the lining -->
  <path d="M168 40Q200 26 232 40L200 74Z" fill="url(#camo)" stroke="#14451d" stroke-width="1.4"/>
  <path d="M176 44Q200 36 224 44L200 70Z" fill="#000" opacity=".22" filter="url(#soft)"/>
  <g stroke="#14451d" stroke-width="1.6" stroke-linejoin="round">
    <path d="M168 40L200 74 182 102 152 48Z" fill="url(#g)"/>
    <path d="M232 40L200 74 218 102 248 48Z" fill="url(#g)"/>
  </g>
  <path d="M168 40L200 74 194 81 162 45Z" fill="url(#camo)" stroke="#14451d" stroke-width="1.2"/>
  <path d="M232 40L200 74 206 81 238 45Z" fill="url(#camo)" stroke="#14451d" stroke-width="1.2"/>
  <path d="M182 102L152 48M218 102L248 48" stroke="#000" stroke-opacity=".35" stroke-width="4" filter="url(#soft)"/>

  <!-- front opening -->
  <path d="M200 76V283" stroke="#14451d" stroke-width="1.6"/>
  <path d="M195 80V282" stroke="#000" stroke-opacity=".25" stroke-width="3" filter="url(#soft)"/>

  <!-- chest pockets with pointed button flaps -->
  <g stroke="#14451d" stroke-width="1.4" stroke-linejoin="round">
    <rect x="142" y="114" width="46" height="48" rx="4" fill="url(#g)"/>
    <rect x="212" y="114" width="46" height="48" rx="4" fill="url(#g)"/>
  </g>
  <g fill="#000" opacity=".3" filter="url(#soft)">
    <path d="M141 120h48l-4 14q-20 6-40 0z"/><path d="M211 120h48l-4 14q-20 6-40 0z"/>
  </g>
  <g stroke="#14451d" stroke-width="1.4" stroke-linejoin="round">
    <path d="M140 112h50l-4 18q-21 7-42 0z" fill="url(#g)"/>
    <path d="M210 112h50l-4 18q-21 7-42 0z" fill="url(#g)"/>
  </g>
  <g fill="none" stroke="#9ed0a6" stroke-opacity=".35" stroke-dasharray="3 3">
    <path d="M146 118h38M216 118h38"/>
  </g>

  <!-- buttons -->
  <g fill="url(#btn)" stroke="#241a10" stroke-width=".8">
    <circle cx="165" cy="126" r="3.6"/><circle cx="235" cy="126" r="3.6"/>
    <circle cx="200" cy="96" r="4.2"/><circle cx="200" cy="134" r="4.2"/><circle cx="200" cy="172" r="4.2"/>
    <circle cx="200" cy="232" r="4.2"/><circle cx="200" cy="266" r="4.2"/>
  </g>

  <!-- fabric belt, cinched and tied in front -->
  <path d="M126 192Q200 200 274 192V206Q200 214 126 206Z" fill="url(#g)" stroke="#14451d" stroke-width="1.4"/>
  <path d="M126 197Q200 205 274 197" fill="none" stroke="#000" stroke-opacity=".15"/>
  <path d="M192 204q-16 18-8 40" fill="none" stroke="#14451d" stroke-width="7" stroke-linecap="round"/>
  <path d="M192 204q-16 18-8 40" fill="none" stroke="#2f9142" stroke-width="5" stroke-linecap="round"/>
  <path d="M208 204q14 16 6 34" fill="none" stroke="#14451d" stroke-width="7" stroke-linecap="round"/>
  <path d="M208 204q14 16 6 34" fill="none" stroke="#2a8239" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="200" cy="203" rx="9" ry="7" fill="url(#g)" stroke="#14451d" stroke-width="1.4"/>
</svg>
