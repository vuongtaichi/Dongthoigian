<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Bình tông đựng nước quân đội, ca nhôm và túi vải ngụy trang">
  <defs>
    <pattern id="camo" width="90" height="90" patternUnits="userSpaceOnUse">
      <rect width="90" height="90" fill="#4c6a33"/>
      <path d="M5 10q20-12 38 2t30 0 14 18-22 8-30-6-26 4z" fill="#6f4f34"/>
      <path d="M40 50q18-8 30 4t-6 20-28-2-4-18z" fill="#232a1e"/>
      <path d="M0 60q12-6 20 4t-4 16-16-4z" fill="#7fa04a"/>
      <path d="M60 2q14 2 20 12t-10 10-14-10z" fill="#232a1e"/>
    </pattern>
    <linearGradient id="body" x1="0" x2="1">
      <stop offset="0" stop-color="#2f3a26"/><stop offset=".35" stop-color="#4b5a3a"/><stop offset="1" stop-color="#29331f"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" x2="1">
      <stop offset="0" stop-color="#3f5a2a"/><stop offset=".4" stop-color="#5f7f3d"/><stop offset="1" stop-color="#36501f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#eef1ea"/>
  <ellipse cx="205" cy="268" rx="175" ry="16" fill="#d6dccf"/>
  <!-- camouflage cover, behind on the right -->
  <path d="M262 190q8-34 46-36t62 16 10 52-30 40-60 4-30-34z" fill="url(#camo)" stroke="#2a3322" stroke-width="2"/>
  <path d="M270 186q30-18 92-6" fill="none" stroke="#2a3322" stroke-width="2"/>
  <circle cx="318" cy="176" r="4" fill="#9aa08c" stroke="#2a3322"/>
  <!-- flask -->
  <path d="M168 104q-20 6-22 40l0 96q2 22 26 24h70q24-2 26-24v-96q-2-34-22-40z" fill="url(#body)" stroke="#1d2418" stroke-width="2"/>
  <path d="M160 140q0-24 14-30" fill="none" stroke="#7e8c69" stroke-width="5" stroke-linecap="round" opacity=".45"/>
  <g stroke="#5c6b49" stroke-width="3" stroke-linecap="round" opacity=".8">
    <path d="M176 160h60M172 172h70M178 184h56M196 196h20"/>
  </g>
  <rect x="190" y="86" width="34" height="20" rx="3" fill="#1b1e1a"/>
  <rect x="184" y="56" width="46" height="32" rx="5" fill="#16191a" stroke="#000" stroke-width="1.5"/>
  <g stroke="#3a3f40" stroke-width="2"><path d="M192 60v24M200 60v24M208 60v24M216 60v24M224 60v24"/></g>
  <rect x="198" y="44" width="18" height="14" rx="3" fill="#16191a"/>
  <path d="M230 72q30 4 30 40" fill="none" stroke="#2b3123" stroke-width="2.5"/>
  <!-- aluminium cup, in front on the left -->
  <path d="M50 178h86l-6 80q-1 8-10 8h-54q-9 0-10-8z" fill="url(#cup)" stroke="#2c3f1c" stroke-width="2"/>
  <ellipse cx="93" cy="178" rx="43" ry="12" fill="#e9ebe6" stroke="#2c3f1c" stroke-width="2"/>
  <ellipse cx="93" cy="180" rx="34" ry="7" fill="#cfd3cc"/>
  <path d="M136 192q22 2 22 22t-24 22" fill="none" stroke="#3f5a2a" stroke-width="6" stroke-linecap="round"/>
</svg>
