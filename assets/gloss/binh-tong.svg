<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Bình tông đựng nước quân đội và nắp nhôm">
  <defs>
    <linearGradient id="body" x1="0" x2="1">
      <stop offset="0" stop-color="#2f3a26"/><stop offset=".35" stop-color="#4b5a3a"/><stop offset="1" stop-color="#29331f"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" x2="1">
      <stop offset="0" stop-color="#3f5a2a"/><stop offset=".4" stop-color="#5f7f3d"/><stop offset="1" stop-color="#36501f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#eef1ea"/>
  <ellipse cx="200" cy="268" rx="150" ry="16" fill="#d6dccf"/>
  <!-- bottle + lid, shifted right so the pair is centred -->
  <g transform="translate(54 0)">
    <!-- flask -->
    <path d="M168 104q-20 6-22 40l0 96q2 22 26 24h70q24-2 26-24v-96q-2-34-22-40z" fill="url(#body)" stroke="#1d2418" stroke-width="2"/>
    <path d="M160 140q0-24 14-30" fill="none" stroke="#7e8c69" stroke-width="5" stroke-linecap="round" opacity=".45"/>
    <g stroke="#5c6b49" stroke-width="3" stroke-linecap="round" opacity=".8">
      <path d="M176 160h60M172 172h70M178 184h56M196 196h20"/>
    </g>
    <rect x="190" y="86" width="34" height="20" rx="3" fill="#1b1e1a"/>
    <rect x="184" y="56" width="46" height="32" rx="5" fill="#16191a" stroke="#000" stroke-width="1.5"/>
    <g stroke="#3a3f40" stroke-width="2"><path d="M192 60v24M200 60v24M208 60v24M216 60v24M224 60v24"/></g>
    <rect x="198" y="44" width="18" height="14" rx="3" fill="#16191a"/>
    <path d="M230 72q30 4 30 40" fill="none" stroke="#2b3123" stroke-width="2.5"/>
    <!-- the flask's aluminium lid (doubles as a cup), in front on the left:
         wide and shallow, no handle -->
    <path d="M24 212h120l-5 46q-1 8-10 8h-90q-9 0-10-8z" fill="url(#cup)" stroke="#2c3f1c" stroke-width="2"/>
    <ellipse cx="84" cy="212" rx="60" ry="13" fill="#e9ebe6" stroke="#2c3f1c" stroke-width="2"/>
    <ellipse cx="84" cy="214" rx="50" ry="8" fill="#cfd3cc"/>
  </g>
</svg>
