<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nhật Ký Lính Thông Tin</title>

  <link rel="icon" type="image/svg+xml" href="assets/logo_v2.svg" />
  <link rel="alternate icon" type="image/png" href="assets/favicon-32.png" />

  <!-- No web fonts on purpose: the site uses the local system serif
       (Times New Roman) for the reading body and the system UI sans
       (Segoe UI) for the interface — see the font notes in styles.css.
       This keeps the hosted site rendering identically to the published
       Claude Artifact, which can't load web fonts at all.
       One exception: a tiny Noto Color Emoji subset (only the emojis the
       site offers — REACTIONS + CHAT_EMOJIS + 🙂📎 in app.js; keep this
       `text=` list in sync) so an emoji typed into the chat box matches the
       Noto images in the picker and in sent messages. Chat is Vercel-only. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap&text=%F0%9F%91%8D%E2%9D%A4%EF%B8%8F%F0%9F%98%82%F0%9F%98%AE%F0%9F%98%A2%F0%9F%98%80%F0%9F%98%8D%F0%9F%A5%B3%F0%9F%8E%89%F0%9F%99%8F%F0%9F%98%85%F0%9F%98%8E%F0%9F%A4%94%F0%9F%98%AD%F0%9F%94%A5%F0%9F%91%8F%F0%9F%A5%B0%F0%9F%98%B4%F0%9F%99%8C%F0%9F%92%AF%E2%9C%A8%F0%9F%99%82%F0%9F%93%8E" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="progress-track" aria-hidden="true">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="app">
    <button class="drawer-toggle" id="drawerToggle" aria-label="Mở mục lục" aria-expanded="false">
      <span class="bars"><span></span><span></span><span></span></span>
      <span class="drawer-toggle-label">Mục lục</span>
    </button>

    <nav class="sidebar" id="sidebar" aria-label="Mục lục nhật ký">
      <div class="masthead">
        <div class="masthead-brand">
          <img class="masthead-logo" src="assets/logo_v2.svg" alt="" width="40" height="40" />
          <h1 class="masthead-title">Nhật Ký Lính Thông Tin</h1>
        </div>
        <p class="masthead-count" id="mastheadCount"></p>
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="search" id="searchInput" class="search-input" placeholder="Tìm chương, tên, nội dung..." aria-label="Tìm kiếm trong nhật ký" />
          <button type="button" class="search-clear" id="searchClear" aria-label="Xóa tìm kiếm" hidden><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
        </div>
      </div>
      <ol class="toc" id="toc"></ol>
      <div class="sidebar-footer">
        <p>Tên đơn vị và các nhân vật xuất hiện trong nhật ký đều đã được thay đổi để đảm bảo sự riêng tư.</p>
        <p class="sidebar-footer-links">
          <a href="/privacy.html">Quyền riêng tư</a>
          <span aria-hidden="true">·</span>
          <a href="/terms.html">Điều khoản</a>
        </p>
        <p class="copyright">&copy; 2027</p>
      </div>
    </nav>

    <div class="scrim" id="scrim"></div>

    <main class="reader" id="reader"></main>
  </div>

  <!-- data.js defines the `chapters` array (the diary content) -->
  <script src="data.js"></script>

  <!-- Comments + reactions backend (Supabase). The widgets only appear once
       supabase-config.js has real credentials filled in; otherwise the site
       behaves exactly as before. Not included in the Claude Artifact build. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <!-- app.js renders the sidebar + reader and wires up navigation -->
  <script src="app.js"></script>
</body>
</html>
