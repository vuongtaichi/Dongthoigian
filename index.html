<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nhật Ký Lính Thông Tin</title>

  <!-- No web fonts on purpose: the site uses the local system serif
       (Times New Roman) for the reading body and the system UI sans
       (Segoe UI) for the interface — see the font notes in styles.css.
       This keeps the hosted site rendering identically to the published
       Claude Artifact, which can't load web fonts at all. -->

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="progress-track" aria-hidden="true">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="app">
    <button class="drawer-toggle" id="drawerToggle" aria-label="Mở mục lục" aria-expanded="false">
      <span class="bars"><span></span><span></span><span></span></span>
      Mục lục
    </button>

    <nav class="sidebar" id="sidebar" aria-label="Mục lục nhật ký">
      <div class="masthead">
        <h1 class="masthead-title">Nhật Ký<br>Lính Thông Tin</h1>
        <p class="masthead-count" id="mastheadCount"></p>
        <div class="search-box">
          <input type="search" id="searchInput" class="search-input" placeholder="Tìm chương, tên, nội dung..." aria-label="Tìm kiếm trong nhật ký" />
        </div>
      </div>
      <ol class="toc" id="toc"></ol>
      <div class="sidebar-footer">
        <p>Tên đơn vị và các nhân vật xuất hiện trong nhật ký đều đã được thay đổi để đảm bảo sự riêng tư.</p>
        <p class="copyright">&copy; 2027</p>
      </div>
    </nav>

    <div class="scrim" id="scrim"></div>

    <main class="reader" id="reader"></main>
  </div>

  <!-- data.js defines the `chapters` array (the diary content) -->
  <script src="data.js"></script>

  <!-- Comments + reactions backend (Supabase). The widgets only appear once
       supabase-config.js has real credentials filled in; otherwise the site
       behaves exactly as before. Not included in the Claude Artifact build. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <!-- app.js renders the sidebar + reader and wires up navigation -->
  <script src="app.js"></script>
</body>
</html>
